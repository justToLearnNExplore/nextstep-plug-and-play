[project]
name = "nextstep-box"
version = "0.1.0"
description = "NextStep Box: plug-and-play hardware that lets an AI agent use any Android or iPhone for elderly people"
requires-python = ">=3.11"
dependencies = ["google-genai>=2.33", "httpx>=0.27", "pydantic>=2.10", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["box*"]  # helper/ (Android app) and pi/ (setup scripts) are not Python packages

[tool.setuptools.package-data]
"box.drivers" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
